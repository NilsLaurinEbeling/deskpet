<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>deskpet overlay</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
      }
      /* The canvas covers the whole screen; only the pet pixels are ever
         clickable, and that is decided in Rust via the hit mask. */
      canvas {
        display: block;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/windows/overlay/main.tsx"></script>
  </body>
</html>
