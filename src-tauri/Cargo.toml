[package]
name = "deskpet"
version = "0.1.0"
description = "A desktop companion built from your own pet photos."
authors = ["deskpet"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop binary links against this; keeping it a lib also keeps the
# door open for integration tests and (later) a mobile entry point.
name = "deskpet_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
